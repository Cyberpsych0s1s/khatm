name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build (gcc/clang)
        run: make
      - name: smoke
        run: make test

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build with sanitizers
        run: make SAN=1
      - name: smoke under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make test

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build fuzzer
        run: make fuzz FUZZCC=clang
      - name: run libFuzzer (60s)
        run: ./fuzz_parse -max_total_time=60 -timeout=10 tests/fuzz_corpus
